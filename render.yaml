# Render Blueprint — 本文件与 package.json 同级，仓库根目录即 code_demo_web
# 用法：Render Dashboard → New → Blueprint → 选仅含本目录的仓库
services:
  - type: web
    name: founder-bridge-ai
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: node scripts/render-start.cjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_SITE_URL
        value: https://founder-bridge-ai.onrender.com
      - key: APP_URL
        value: https://founder-bridge-ai.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: founder-bridge-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: founder-bridge-db
          property: connectionString
      - key: ENABLE_DEMO_LOGIN
        value: "false"
      - key: ENABLE_GUEST
        value: "false"
      - key: DEMO_SEED_SECRET
        generateValue: true

databases:
  - name: founder-bridge-db
    plan: free
    databaseName: founder_bridge
    user: founder_bridge_user
